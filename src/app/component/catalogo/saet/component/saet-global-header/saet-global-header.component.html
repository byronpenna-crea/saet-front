<div class="titlePage">
  <div
    class="form-container"
    style="display: flex; flex-direction: row; gap: 8px"
  >
    <ng-container *ngFor="let item of breadcrumb; let isLast = last">
      <a *ngIf="item.href !== ''" [href]="item.href">{{ item.text }}</a>
      <span
        style="color: #00498d"
        [ngClass]="{
          'hightlight-header-text-menu': item.highlight
        }"
        *ngIf="item.href === ''"
        >{{ item.text }}</span
      >
      <span *ngIf="!isLast"> / </span>
    </ng-container>
  </div>
  <div class="form-container divInforme">
    <h3>{{ getModuleString() }} - Buscar estudiante</h3>
    <div class="barra-colores">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>
</div>
<div class="form-container">
  <app-saet-student-name-header [name]="nombreCompleto" />
</div>
<div class="form-container">
  <app-saet-tab-buttons>
    <a
      *ngFor="let tab of tabMenu"
      type="button"
      class="p-button p-component tabButton"
      [attr.data-testid]="tab.testId"
      [ngClass]="{
        tabSeletectedButton: isSelected(tab.name),
        'global-header-read-only': tab.readOnly
      }"
      [href]="tab.readOnly ? null : tab.url"
      (click)="handleClick($event, tab.url, tab.readOnly)"
    >
      {{ tab.text }}
    </a>
  </app-saet-tab-buttons>
</div>

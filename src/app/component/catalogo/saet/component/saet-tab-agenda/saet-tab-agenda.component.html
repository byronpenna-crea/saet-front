<app-saet-tab [readOnly]="readOnly" [leyend]="leyend">
  <p-tabView>
    <p-tabPanel header="Agendar perfil">
      <div *ngIf="!agendado">
        <div class="flex wrap margin-top">
          <div class="first-column">
            <label class="first-item">Fecha de evaluación perfil:</label>
            <div class="second-item">
              <p-calendar
                [disabled]="readOnly"
                [showIcon]="true"
                dateFormat="dd/mm/yy"
                (onSelect)="onFechaEvaluacionSelect($event)"
              >
              </p-calendar>
            </div>
          </div>
          <div class="second-column">
            <label class="first-item">Hora de evaluación perfil:</label>
            <div class="second-item-time">
              <p-calendar
                inputId="calendar-timeonly"
                [disabled]="readOnly"
                (onSelect)="onEvaluationTimeSelect($event)"
                [timeOnly]="true"
                [ngModel]="profileTime"
                (ngModelChange)="onEvaluationTimeChange($event)"
              />
            </div>
          </div>
        </div>
      </div>

      <!-- ────────────────────────────────────────────────────────────────
     BLOQUE SOLO-LECTURA CUANDO YA EXISTE UNA AGENDA (agendado=true)
     ────────────────────────────────────────────────────────────────-->
      <ng-container *ngIf="agendado">
        <!-- Especialista responsable ----------------------------------- -->
        <app-tab-item
          marginTop="3%"
          label="Especialista responsable de agendar"
        >
          <app-saet-input
            class="full-width"
            [disabled]="true"
            [value]="
              especialistaAgendado?.nombreCompleto ||
              'Especialista no disponible'
            "
          >
          </app-saet-input>

          <small class="agendado-sub">
            {{
              especialistaAgendado?.dui
                ? especialistaAgendado.dui + ' |'
                : 'Nº dui no disponible | '
            }}
            Evaluador
            {{ especialidad ? getSpecialistLabel(especialidad) : '' }} - COR
          </small>
        </app-tab-item>

        <hr />

        <div class="agendado-row">
          <div class="agendado-tiempo">
            <label class="agendado-label">Fecha de evaluación perfil:</label>
            <app-saet-input [disabled]="true" [value]="fechaAgendado">
            </app-saet-input>
          </div>

          <div class="agendado-tiempo">
            <label class="agendado-label">Hora de evaluación perfil:</label>
            <app-saet-input [disabled]="true" [value]="horaAgendado">
            </app-saet-input>
          </div>
        </div>
      </ng-container>

      <div *ngIf="!agendado">
        <div class="actionsButton">
          <div></div>
          <div class="right-buttons">
            <app-saet-button
              (onClick)="agendar()"
              [disabled]="readOnly"
              [buttonArgs]="{
                buttonIcon: buttonIcon.EYE,
                buttonStyle: buttonStyle.BLUE,
                text: 'Agendar perfil'
              }"
            />
          </div>
        </div>
      </div>
      <div *ngIf="agendado">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 3%;
          "
        >
          <div></div>
          <!--          *ngIf="!readOnly"-->
          <div *ngIf="!readOnly || current" class="right-buttons">
            <div style="display: flex">
              <span
                *ngIf="!perfilIniciado"
                data-testId="btn-clean"
                class="link-text"
                (click)="cancelar()"
                >Cancelar agenda</span
              >
            </div>
            <app-saet-button
              (onClick)="iniciar()"
              [disabled]="current ? false : readOnly"
              [buttonArgs]="{
                buttonIcon: buttonIcon.PLUS,
                buttonStyle: buttonStyle.WHITE,
                text: perfilIniciado ? 'Ver perfil' : 'Iniciar perfil'
              }"
            />
            {{ perfilIniciado }}
          </div>
        </div>
      </div>
    </p-tabPanel>
    <p-tabPanel header="Agendar evaluación">
      <div *ngIf="!agendadoEvaluacion">
        <!--        pestana de evaluacion-->
        {{ readOnlyEvaluacion }}
        <div class="flex wrap margin-top">
          <div class="first-column">
            <label class="first-item">Fecha de evaluación:</label>
            <div class="second-item">
              <p-calendar
                [disabled]="readOnlyEvaluacion"
                [showIcon]="true"
                dateFormat="dd/mm/yy"
                (onSelect)="onFechaEvaluacionSelect($event)"
              >
              </p-calendar>
            </div>
          </div>
          <div class="second-column">
            <label class="first-item">Hora de evaluación:</label>
            <div class="second-item-time">
              <p-calendar
                inputId="calendar-timeonly"
                [disabled]="readOnlyEvaluacion"
                (onSelect)="onEvaluationTimeSelect($event)"
                [timeOnly]="true"
                [ngModel]="profileTime"
                (ngModelChange)="onEvaluationTimeSelect($event)"
              />
            </div>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin: 2%">
          <app-saet-button
            [disabled]="readOnly"
            (onClick)="agendarEvaluacion()"
            [buttonArgs]="{
              buttonIcon: buttonIcon.PLUS,
              buttonStyle: buttonStyle.WHITE,
              text: 'Agendar evaluacion'
            }"
          />
        </div>
      </div>
      <div *ngIf="!agendado">
        <div class="actionsButton">
          <div></div>
          <!--          <div class="right-buttons">-->
          <!--            <app-saet-button-->
          <!--              (onClick)="agendarEvaluacion()"-->
          <!--              [disabled]="readOnly"-->
          <!--              [buttonArgs]="{-->
          <!--                buttonIcon: buttonIcon.PLUS,-->
          <!--                buttonStyle: buttonStyle.WHITE,-->
          <!--                text: 'Agendar evaluacion'-->
          <!--              }"-->
          <!--            />-->
          <!--          </div>-->
        </div>
      </div>
      <div *ngIf="agendadoEvaluacion">
        <div class="agendado-row">
          <div class="agendado-tiempo">
            <label class="agendado-label">Fecha de evaluaciónx:</label>
            <app-saet-input [disabled]="true" [value]="fechaAgendado">
            </app-saet-input>
          </div>

          <div class="agendado-tiempo">
            <label class="agendado-label">Hora de evaluación:</label>
            <app-saet-input [disabled]="true" [value]="horaAgendado">
            </app-saet-input>
          </div>
        </div>
      </div>

      <!--      <app-saet-agendar-evaluacion [readOnly]="readOnly" />-->
    </p-tabPanel>
  </p-tabView>
</app-saet-tab>

<div #topAnchor style="height: 1px"></div>
<div style="width: 100%">
  <p-tabView (onChange)="onTabChange($event)">
    <p-tabPanel header="Informe cualitativo"> </p-tabPanel>
    <p-tabPanel header="Informe cuantitativo" [selected]="true">
      <div style="display: flex; gap: 25px; margin-bottom: 25px">
        <app-saet-tarjeta-informe
          [numero]="corCount"
          titulo="Total de miembros"
          descripcion="Centro de Orientación y Recursos (COR)"
          [style]="style.BLUE"
        />
        <app-saet-tarjeta-informe
          [numero]="daiCount"
          titulo="Total de miembros"
          descripcion="Docente de Apoyo a la Inclusion (DAI)"
        />

        <app-saet-tarjeta-informe
          [numero]="0"
          titulo="Total de miembros"
          descripcion="Consejería Escolar (CE)"
        />
        <app-saet-tarjeta-informe
          [numero]="0"
          titulo="Total de instituciones"
          descripcion="Escuela de Educación Especial (EEE)"
        />
        <app-saet-tarjeta-informe
          [numero]="0"
          titulo="Total de Comités"
          descripcion="Comité Departamental de Apoyo a la Inclusión (CODAI)"
        />
        <app-saet-tarjeta-informe
          [numero]="0"
          titulo="Total de cries"
          descripcion="Centro de recursos para la inclusion de estudiantes con discapacidad visual (CRIEDV)"
        />
        <!--        Comité Departamental de Apoyo a la Inclusión (CODAI)-->
      </div>

      <div style="display: flex; flex-direction: column; gap: 20px">
        <h2 class="title">Datos generales a nivel nacional</h2>
        <div class="graphics-container">
          <div class="filters-parent-div">
            <div style="flex: 2">
              <fieldset style="border: 1px solid #ccc; padding: 10px">
                <legend style="font-weight: bold">Geografía</legend>
                <div class="filter-container">
                  <div class="filter-cell">
                    <label>Zonas</label>
                    <p-dropdown
                      [options]="zones"
                      id="zona-global"
                      optionLabel="zone_nombre"
                      placeholder="Selecciona"
                      optionValue="zone_codigo"
                    />
                  </div>
                  <div class="filter-cell">
                    <label>Centro Educativo</label>
                    <p-dropdown
                      [options]="schools"
                      id="centro-educativo-global"
                      optionLabel="sed_nombre"
                      placeholder="Selecciona"
                      optionValue="sed_pk"
                    />
                  </div>
                  <div class="filter-cell">
                    <label>Sexo</label>
                    <p-dropdown
                      [options]="sexs"
                      id="sexo-global"
                      optionLabel="sex_nombre"
                      placeholder="Selecciona"
                      optionValue="sex_codigo"
                    />
                  </div>
                  <div class="filter-cell">
                    <label>Departamento</label>
                    <p-dropdown
                      [options]="cities"
                      id="departamento-global"
                      (onChange)="onGlobalDepartmentChange($event)"
                      optionLabel="nombre_departamento"
                      placeholder="Selecciona departamento"
                      optionValue="codigo_departamento"
                    />
                  </div>
                  <div class="filter-cell">
                    <label>Grado</label>
                    <p-dropdown
                      [options]="[]"
                      id="grado-global"
                      optionLabel="centro_label"
                      placeholder="Selecciona"
                      optionValue="centro_value"
                    />
                  </div>
                </div>
              </fieldset>
            </div>

            <!-- Sección de Período de tiempo -->
            <div style="flex: 1">
              <fieldset style="border: 1px solid #ccc; padding: 10px">
                <legend style="font-weight: bold">Período de tiempo</legend>
                <div style="display: flex; flex-direction: column; gap: 10px">
                  <div class="periodo-tiempo-row">
                    <label for="desde" class="periodo-tiempo-label"
                      >Desde:</label
                    >
                    <p-calendar
                      id="desde"
                      [showIcon]="true"
                      dateFormat="dd/mm/yy"
                      styleClass="periodo-tiempo-input"
                    >
                    </p-calendar>
                  </div>
                  <div class="periodo-tiempo-row">
                    <label for="hasta" class="periodo-tiempo-label"
                      >Hasta:</label
                    >
                    <p-calendar
                      id="hasta"
                      [showIcon]="true"
                      dateFormat="dd/mm/yy"
                      styleClass="periodo-tiempo-input"
                    >
                    </p-calendar>
                  </div>
                </div>
              </fieldset>
            </div>
          </div>
        </div>
        <div class="graphics-container">
          <div class="graphic-container">
            <h3>Caracterizaciones por departamentos</h3>
            <app-saet-grafica-pastel
              [single]="[
                { name: 'Ahuachapán', value: 15 },
                { name: 'Usulután', value: 13 },
                { name: 'Sonsonate', value: 8 },
                { name: 'Cuscatlán', value: 3 },

                { name: 'La Paz', value: 3 },
                { name: 'La Unión', value: 3 },
                { name: 'La Libertad', value: 3 },
                { name: 'San Vicente', value: 3 },
                { name: 'Morazán', value: 3 },
                { name: 'San Miguel', value: 3 },
                { name: 'San Salvador', value: 3 },
                { name: 'Santa Ana', value: 3 },
                { name: 'Chalatenango', value: 3 },
                { name: 'Cabañas', value: 3 }
              ]"
            />
            <div class="radios">
              <div>
                <app-saet-individual-radio
                  name="caracterizaciones-departamento"
                  value="1"
                  label="Realizadas"
                />
              </div>
              <div>
                <app-saet-individual-radio
                  name="caracterizaciones-departamento"
                  value="1"
                  label="En proceso"
                />
              </div>
              <div>
                <app-saet-individual-radio
                  name="caracterizaciones-departamento"
                  value="1"
                  label="Programadas"
                />
              </div>
            </div>
          </div>
          <div class="graphic-container">
            <h3>Plan educativo integral (PAEI)</h3>
            <app-saet-grafica-barras
              [single]="paeiData"
              [mode]="direction.LANDSCAPE"
            />
            <div class="radios">
              <app-saet-individual-radio
                name="estado-paei"
                value="1"
                [checked]="estadoPaeiSeleccionado === '1'"
                label="En proceso"
                (click)="onEstadoPAEIChange(1)"
              />
              <app-saet-individual-radio
                name="estado-paei"
                value="3"
                [checked]="estadoPaeiSeleccionado === '3'"
                label="Socializado"
                (click)="onEstadoPAEIChange(3)"
              />
              <app-saet-individual-radio
                name="estado-paei"
                value="4"
                [checked]="estadoPaeiSeleccionado === '4'"
                label="Finalizado"
                (click)="onEstadoPAEIChange(4)"
              />
              <!--              <div>-->
              <!--                <app-saet-individual-radio-->
              <!--                  name="evaluaciones-departamento"-->
              <!--                  value="1"-->
              <!--                  label="Realizadas"-->
              <!--                />-->
              <!--              </div>-->
              <!--              <div>-->
              <!--                <app-saet-individual-radio-->
              <!--                  name="evaluaciones-departamento"-->
              <!--                  value="1"-->
              <!--                  label="En proceso"-->
              <!--                />-->
              <!--              </div>-->
              <!--              <div>-->
              <!--                <app-saet-individual-radio-->
              <!--                  name="evaluaciones-departamento"-->
              <!--                  value="1"-->
              <!--                  label="Programadas"-->
              <!--                />-->
              <!--              </div>-->
            </div>
          </div>
        </div>
        <div class="graphics-container">
          <div class="graphic-container">
            <h3>Concentracion de la demanda del servicio</h3>
            <app-saet-grafica-pastel
              [single]="[
                { name: 'Ahuachapán', value: 15 },
                { name: 'Usulután', value: 13 },
                { name: 'Sonsonate', value: 8 },
                { name: 'Cuscatlán', value: 3 },

                { name: 'La Paz', value: 3 },
                { name: 'La Unión', value: 3 },
                { name: 'La Libertad', value: 3 },
                { name: 'San Vicente', value: 3 },
                { name: 'Morazán', value: 3 },
                { name: 'San Miguel', value: 3 },
                { name: 'San Salvador', value: 3 },
                { name: 'Santa Ana', value: 3 },
                { name: 'Chalatenango', value: 3 },
                { name: 'Cabañas', value: 3 }
              ]"
            />
            <div style="display: flex; flex-direction: column; gap: 5px">
              <div class="flex-center filter-input" style="">
                <div class="filter-cell">
                  <div class="filter-label">Departamentos</div>
                  <p-dropdown
                    [options]="cities"
                    optionLabel="nombre_departamento"
                    placeholder="Selecciona departamento"
                    optionValue="nombre_departamento"
                  />
                </div>
              </div>
            </div>
          </div>
          <div class="graphic-container">
            <h3>Dificultades en el proceso educativo</h3>
            <app-saet-grafica-barras
              [mode]="direction.VERTICAL"
              [single]="dificultadesGrafica"
            />
            <div style="display: flex; flex-direction: column; gap: 5px"></div>
          </div>
        </div>
        <div class="graphics-container">
          <div class="graphic-container">
            <h3>Concentracion de la demanda del servicio</h3>
            <app-saet-grafica-linear
              [view]="[1024, 300]"
              [multi]="filteredCasosAbordadosData"
            />
            <div class="flex-center filter-input" style="">
              <div class="filter-cell">
                <div class="filter-label">Departamentos</div>
                <p-dropdown
                  [options]="cities"
                  id="casos-abordados"
                  (onChange)="onCasesChange($event)"
                  optionLabel="nombre_departamento"
                  placeholder="Selecciona departamento"
                  optionValue="codigo_departamento"
                  [ngModel]="selectedGraphics.casos"
                />
              </div>
            </div>
          </div>
        </div>
        <div>
          <app-saet-button
            testId="btn-regresar"
            [customClasses]="'return-button'"
            (onClick)="btnRegresar()"
            [buttonArgs]="{
              text: 'Regresar',
              buttonStyle: ButtonStyle.BLUE,

              buttonIcon: IconCompoment.LEFT_ARROW
            }"
          />
        </div>
      </div>
    </p-tabPanel>
    <p-tabPanel header="Informe Trimestral COR"> </p-tabPanel>
  </p-tabView>
</div>
<button
  class="scroll-up-btn"
  (click)="scrollToTop()"
  pButton
  icon="pi pi-arrow-up"
  label=""
></button>
<button
  class="scroll-bottom-btn"
  (click)="scrollToBottom()"
  pButton
  icon="pi pi-arrow-down"
  label=""
></button>
<div #bottomAnchor style="height: 1px"></div>
